[package]
name = "rust-pass-lab"
version = "0.1.0"
edition = "2024"

[dependencies]
sha2 = "0.10"
num-format = "0.4"
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower-http = { version = "0.6", features = ["fs", "cors"] }